name: ci

on:
  push:
    branches: [main, m6-perf]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    # Windows matches where the client is developed. Nephele contains no game
    # files, so CI needs nothing prepared: the asset-reading tests skip.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Public tree contains no Minecraft files
        shell: pwsh
        run: ./scripts/check_public_tree.ps1
