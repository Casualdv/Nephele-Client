[package]
name = "nephele-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nephele Client launcher: pick a world, launch the game, see what is installed"

[[bin]]
name = "nephele-launcher"
path = "src/main.rs"

[dependencies]
nephele-assets = { path = "../nephele-assets" }
nephele-render = { path = "../nephele-render" }
nephele-prepare = { path = "../nephele-prepare" }
nephele-auth = { path = "../nephele-auth" }
glam = { workspace = true }
winit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rsa = { version = "0.9", features = ["sha2"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
rand = "0.8"
